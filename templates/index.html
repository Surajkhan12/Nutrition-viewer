<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🥗 Nutrition Explorer - Premium Nutrition Guide</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

<div class="floating-icons">
    <span>🍎</span>
    <span>🍌</span>
    <span>🍇</span>
    <span>🥭</span>
    <span>🍓</span>
    <span>🥕</span>
    <span>🥦</span>
    <span>🥒</span>
    <span>🌽</span>
    <span>🥔</span>
    <span>🥜</span>
    <span>🌰</span>
    <span>🫐</span>
    <span>🍊</span>
    <span>🍑</span>
</div>

<div class="container">
    <div class="glass-card">

        <div class="header-section">
            <h1>
                <i class="fas fa-leaf"></i>
                NUTRITION EXPLORER
            </h1>
            <p class="subtitle">
                Discover Complete Nutritional Information
            </p>
            <p class="subtitle-small">
                Fruits • Vegetables • Dry Fruits
            </p>
        </div>

        <div class="search-section">
            <div class="search-box">
                <input
                type="text"
                id="foodInput"
                class="search-input"
                placeholder="🔍 Search fruits, vegetables, dry fruits...">

                <button class="search-btn" onclick="searchFood()">
                    <i class="fas fa-magnifying-glass"></i>
                    <span>SEARCH</span>
                </button>

                <button class="voice-btn" id="voiceBtn" title="Voice Search">
                    <i class="fas fa-microphone"></i>
                </button>
            </div>

            <div class="quick-category">
                <button class="category-btn" onclick="searchByCategory('Fruit')">Fruits</button>
                <button class="category-btn" onclick="searchByCategory('Vegetable')">Vegetables</button>
                <button class="category-btn" onclick="searchByCategory('Dry Fruit')">Dry Fruits</button>
            </div>
        </div>

        <div id="loader" class="loader hidden"></div>

        <div id="result" class="result-card hidden">
            <div class="result-content"></div>
        </div>

        <div id="errorMsg" class="error-msg hidden"></div>

        <div id="resultsList" class="results-list hidden"></div>

    </div>
</div>

<script src="/static/script.js"></script>

</body>
</html>
